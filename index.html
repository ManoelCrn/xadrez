<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <title>Xadrez no Mercado — PC e VR</title>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <meta property="og:image" content="assets/favicon.ico">
    <meta name="description" content="Jogo de xadrez 3D para computador e realidade virtual, com partidas locais, contra o computador e online, além de modo espectador.">
    <meta property="og:title" content="Xadrez 3D — PC e VR">
    <meta property="og:description" content="Jogo de xadrez 3D para computador e realidade virtual, com partidas locais, contra o computador e online, além de modo espectador.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/Logo192x192.png">

    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <link type="text/css" rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="online.css?v=16" />
    <style>
      body {
        background-color: #02184a;
        color: #000;
      }

      a {
        color: #2983ff;
      }
    </style>
  </head>

  <body class="menu-active">
    <button class="ViewPoint" onclick="CameraTop()" title="Mudar câmera" aria-label="Mudar câmera">
      <ion-icon name="color-wand-outline"></ion-icon>
    </button>
    <button class="Reset" onclick="ReloadGame()" title="Reiniciar partida" aria-label="Reiniciar partida">
      <ion-icon name="refresh-outline"></ion-icon>
    </button>
    <button class="HomeMenu" type="button" onclick="ReturnToMainMenu()" title="Voltar ao menu principal" aria-label="Voltar ao menu principal">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5 9v12h5v-7h4v7h5V9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Menu principal</span>
    </button>
    <div id="LoadingBox" class="market-menu">
      <div class="menu-shell">
        <header class="menu-brand">
          <div class="menu-eyebrow"><span class="menu-symbol" aria-hidden="true">♞</span> MERCADO DA TURMA</div>
          <h1>Xadrez<br><span>no Mercado</span></h1>
          <p>Estratégia em cada jogada.</p>
          <div class="menu-platforms"><span>COMPUTADOR</span><span>REALIDADE VIRTUAL</span></div>
        </header>
        <div id="LoadInnerText"><button class="loadButton" disabled>Preparando o mercado…</button></div>
        <footer class="menu-footer"><p id="facts" class="facts"></p><p id="fingers"></p></footer>
      </div>
      <p id="factstemp" hidden></p>
    </div>
    <div id="container"></div>

    <div id="celebrate">
      <button onclick="WinnerShowCase()">Comemorar</button>
    </div>

    <div id="promosion" >
      
    </div>

    <div id="info"></div>
    <script>
      function ShowMainMenu() {
        document.getElementById('LoadingBox').classList.add('ready');
        document.getElementById('LoadInnerText').innerHTML=`
          <button class="menu-primary" onclick="active()">Jogar <span aria-hidden="true">→</span></button>
          <button class="menu-secondary" onclick="ShowOnlineMenu()">Jogar online / Assistir</button>`;
      }
      function active() {
        stopFacts();
        document.getElementById('LoadInnerText').innerHTML=`
          <h2 class="menu-section-title">Como você quer jogar?</h2>
          <button class="menu-choice" onclick="ModeSet(0)"><strong>2 jogadores locais</strong><span>Uma partida no mesmo dispositivo</span></button>
          <button class="menu-choice" onclick="VsBot()"><strong>Contra o computador</strong><span>Escolha sua cor e desafie o computador</span></button>
          <button class="menu-choice" onclick="ShowOnlineMenu()"><strong>Online e espectador</strong><span>PC e óculos na mesma sala</span></button>
          <button class="menu-text" onclick="ModeSet(3)">Assistir ao computador</button>
          <button class="menu-back" onclick="ShowMainMenu()">← Voltar</button>`;
      }
      function ShowOnlineMenu() {
        const panel=document.querySelector('#online-panel details');if(panel)panel.open=true;
        document.getElementById('LoadInnerText').innerHTML=`<h2 class="menu-section-title">Jogue na mesma sala</h2><p class="menu-description">Crie uma sala ou informe o código no painel online. Para acompanhar a partida, escolha assistir como espectador.</p><button class="menu-back" onclick="ShowMainMenu()">← Voltar ao início</button>`;
      }
      function ModeSet(Mode) {
        document.getElementById('LoadingBox').classList.add('Open');
        document.body.classList.remove('menu-active');
        setBotMode(Mode);
      }
      function VsBot() {
        document.getElementById('LoadInnerText').innerHTML=`
          <h2 class="menu-section-title">Escolha suas peças</h2>
          <button class="menu-choice" onclick="ModeSet(2)"><strong>♔ Brancas</strong><span>Você faz a primeira jogada</span></button>
          <button class="menu-choice" onclick="ModeSet(1)"><strong>♚ Pretas</strong><span>O computador começa</span></button>
          <button class="menu-back" onclick="active()">← Voltar</button>`;
      }

      window.addEventListener("load", function () {
        const instruction = document.getElementById("fingers");

        if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
          instruction.textContent = "Use dois dedos para movimentar a câmera";
        } else {
          instruction.textContent = "Use o mouse para movimentar a câmera";
        }
        load3D();
        // active()
      }); 
      const facts = [
        "A partida oficial de xadrez mais longa durou 269 lances.",
        "O objetivo do xadrez é dar xeque-mate no rei adversário.",
        "As brancas sempre fazem o primeiro lance.",
        "O tabuleiro possui 64 casas, organizadas em oito linhas e oito colunas.",
        "Cada jogador começa com 16 peças.",
        "O cavalo se movimenta em L e pode saltar outras peças.",
        "O primeiro relógio mecânico de xadrez foi inventado em 1883.",
        "Um cavalo no centro costuma controlar mais casas do que na borda.",
        "A torre se movimenta em linha reta, pelas linhas e colunas.",
        "Em 1997, o Deep Blue venceu o campeão mundial Garry Kasparov em um confronto.",
        "O bispo se movimenta pelas diagonais.",
        "A dama combina os movimentos da torre e do bispo.",
        "Um peão pode ser promovido a dama, torre, bispo ou cavalo.",
        "O roque movimenta o rei e uma torre na mesma jogada.",
        "A Federação Internacional de Xadrez (FIDE) foi fundada em 1924.",
        "Emanuel Lasker foi campeão mundial por 27 anos.",
        "É possível dar xeque-mate com um rei e dois bispos contra um rei sozinho.",
        "O rei não pode se mover para uma casa atacada.",
        "O peão captura na diagonal e avança pela coluna.",
        "Em 1972, o confronto entre Fischer e Spassky ficou conhecido como a Partida do Século."
];

      let shuffledFacts = [...facts];
      let factIndex = 0;
      let factInterval = null;

      function shuffleFacts() {
        shuffledFacts = facts.sort(() => Math.random() - 0.5);
        factIndex = 0;
      }

      function showFact() {
        if (factIndex >= shuffledFacts.length-1) {
          shuffleFacts(); 
        }
        document.getElementById("facts").classList.remove("active")
        
        setTimeout(()=>{
          document.getElementById("factstemp").innerText=document.getElementById("facts").innerText = shuffledFacts[factIndex];
          document.getElementById("facts").classList.add("active")
        },300)
        factIndex++;
      }

      function startFacts() {
        shuffleFacts();
        showFact();
        factInterval = setInterval(showFact, 10000); 
      }

      function stopFacts() {
        clearInterval(factInterval);
      }
      startFacts();
    </script>
    <script src="./build/gsap.min.js"></script>
    <script src="./build/chess.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./build/three.module.js",
          "three/addons/": "./jsm/"
        }
      }
    </script>

    <script type="module" src="main.js?v=16"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
