<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <title>Xadrez 3D — PC e VR</title>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <meta property="og:image" content="assets/favicon.ico">
    <meta name="description" content="Jogo de xadrez 3D para computador e realidade virtual, com partidas locais, contra o computador e online, além de modo espectador.">
    <meta property="og:title" content="Xadrez 3D — PC e VR">
    <meta property="og:description" content="Jogo de xadrez 3D para computador e realidade virtual, com partidas locais, contra o computador e online, além de modo espectador.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/Logo192x192.png">

    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <link type="text/css" rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="online.css?v=7" />
    <style>
      body {
        background-color: #02184a;
        color: #000;
      }

      a {
        color: #2983ff;
      }
    </style>
  </head>

  <body>
    <button class="ViewPoint" onclick="CameraTop()">
      <ion-icon name="color-wand-outline"></ion-icon>
    </button>
    <button class="Reset" onclick="ReloadGame()">
      <ion-icon name="refresh-outline"></ion-icon>
    </button>
    <div id="LoadingBox">
      <p style="opacity: 0">Carregando o jogo</p>
      <p class="facts active none" style="opacity: 0;" id="factstemp">...</p>
      <div id="LoadInnerText">
        <div>
          <button class="loadButton">Carregando...</button>
        </div>
      </div>
      <p id="facts" class="facts"></p>
      <p id="fingers">...</p>
    </div>
    <div id="container"></div>

    <div id="celebrate">
      <button onclick="WinnerShowCase()">Comemorar</button>
    </div>

    <div id="promosion" >
      
    </div>

    <div id="info"></div>
    <script>
      function active() {
        stopFacts()
        document.getElementById("LoadingBox").style.justifyContent='center';
        document.getElementById("LoadingBox").innerHTML=`
          <div>
            <div><button class="btn options" onclick="ModeSet(0)"><i class="animation"></i>2 jogadores locais<i class="animation"></i></button></div>
            <div><button class="btn options" onclick="VsBot()"><i class="animation"></i>Jogar contra o computador<i class="animation"></i></button></div>
            <div><button class="btn options" onclick="ModeSet(3)"><i class="animation"></i>Assistir ao computador<i class="animation"></i></button></div>
          </div>`;
      }
      function ModeSet(Mode){
        document.getElementById("LoadingBox").classList.add("Open");
        setBotMode(Mode)
      }



      function VsBot(){
        document.getElementById("LoadingBox").innerHTML=`
          <div>
            <p style="margin: 0;background-color: rgba(0, 0, 0, 0.596);border-radius: 10px;">Escolha a cor das suas peças</p>
            <div><button class="btn options" onclick="ModeSet(2)" style="color: black;background-color: white;"><i class=""></i>Brancas<i class=""></i></button></div>
            <div><button class="btn options" onclick="ModeSet(1)"><i class=""></i>Pretas<i class=""></i></button></div>
          </div>`
      }

      window.addEventListener("load", function () {
        const instruction = document.getElementById("fingers");

        if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
          instruction.textContent = "Use dois dedos para movimentar a câmera";
        } else {
          instruction.textContent = "Use o mouse para movimentar a câmera";
        }
        load3D();
        // active()
      }); 
      const facts = [
        "A partida oficial de xadrez mais longa durou 269 lances.",
        "O objetivo do xadrez é dar xeque-mate no rei adversário.",
        "As brancas sempre fazem o primeiro lance.",
        "O tabuleiro possui 64 casas, organizadas em oito linhas e oito colunas.",
        "Cada jogador começa com 16 peças.",
        "O cavalo se movimenta em L e pode saltar outras peças.",
        "O primeiro relógio mecânico de xadrez foi inventado em 1883.",
        "Um cavalo no centro costuma controlar mais casas do que na borda.",
        "A torre se movimenta em linha reta, pelas linhas e colunas.",
        "Em 1997, o Deep Blue venceu o campeão mundial Garry Kasparov em um confronto.",
        "O bispo se movimenta pelas diagonais.",
        "A dama combina os movimentos da torre e do bispo.",
        "Um peão pode ser promovido a dama, torre, bispo ou cavalo.",
        "O roque movimenta o rei e uma torre na mesma jogada.",
        "A Federação Internacional de Xadrez (FIDE) foi fundada em 1924.",
        "Emanuel Lasker foi campeão mundial por 27 anos.",
        "É possível dar xeque-mate com um rei e dois bispos contra um rei sozinho.",
        "O rei não pode se mover para uma casa atacada.",
        "O peão captura na diagonal e avança pela coluna.",
        "Em 1972, o confronto entre Fischer e Spassky ficou conhecido como a Partida do Século."
];

      let shuffledFacts = [...facts];
      let factIndex = 0;
      let factInterval = null;

      function shuffleFacts() {
        shuffledFacts = facts.sort(() => Math.random() - 0.5);
        factIndex = 0;
      }

      function showFact() {
        if (factIndex >= shuffledFacts.length-1) {
          shuffleFacts(); 
        }
        document.getElementById("facts").classList.remove("active")
        
        setTimeout(()=>{
          document.getElementById("factstemp").innerText=document.getElementById("facts").innerText = shuffledFacts[factIndex];
          document.getElementById("facts").classList.add("active")
        },300)
        factIndex++;
      }

      function startFacts() {
        shuffleFacts();
        showFact();
        factInterval = setInterval(showFact, 10000); 
      }

      function stopFacts() {
        clearInterval(factInterval);
      }
      startFacts();
    </script>
    <script src="./build/gsap.min.js"></script>
    <script src="./build/chess.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./build/three.module.js",
          "three/addons/": "./jsm/"
        }
      }
    </script>

    <script type="module" src="main.js?v=7"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
